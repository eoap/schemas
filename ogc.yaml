- type: enum
  name: CRS
  doc: Represents the coordinate reference system
  symbols:
  - 'http://www.opengis.net/def/crs/OGC/1.3/CRS84'
  - 'http://www.opengis.net/def/crs/OGC/0/CRS84h'

- type: record
  name: BBox
  doc: Reflects the OGC [bbox](https://raw.githubusercontent.com/opengeospatial/ogcapi-features/refs/heads/master/core/openapi/parameters/bbox.yaml)
  fields:
  - type:
      type: array
      items: double
    doc: Four or six numbers, depending on whether the coordinate reference system includes a vertical axis (height or depth).
    name: bbox
  - type: CRS
    name: crs
    doc: |
          If the `bbox` value consists of four numbers, the coordinate reference system is
          [WGS 84](http://www.opengis.net/def/crs/OGC/1.3/CRS84)
          unless a different coordinate reference system is specified.

          If the `bbox` value consists of six numbers, the coordinate reference system is
          [WGS 84h](http://www.opengis.net/def/crs/OGC/0/CRS84h)
          longitude/latitude/ellipsoidal height unless a different coordinate reference system is specified.
