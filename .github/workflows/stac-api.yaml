# .github/workflows/ci.yaml
name: CI

on:
  push:
  pull_request:

jobs:
  test-with-stac-fastapi:
    runs-on: ubuntu-latest

    env:
      # Public demo GeoParquet (anonymous access)
      STAC_FASTAPI_COLLECTIONS_HREF: experimental/tests/data/collections.json
      STAC_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server
        run: |
          python -m pip install --upgrade pip
          # GeoParquet 0.0.6 needs the extension modules from before the 6.3 reorganization.
          python -m pip install \
            "stac-fastapi-geoparquet[serve]==0.0.6" \
            "stac-fastapi-api==6.2.1" \
            "stac-fastapi-extensions==6.2.1" \
            "stac-fastapi-types==6.2.1"
          python -m pip install cwltool pystac-client cwltest

      - name: Start STAC API (background)
        run: |
          test -f "$STAC_FASTAPI_COLLECTIONS_HREF" && echo "Found $STAC_FASTAPI_COLLECTIONS_HREF" || { echo "Missing $STAC_FASTAPI_COLLECTIONS_HREF"; exit 1; }
          nohup uvicorn stac_fastapi.geoparquet.main:app --host 127.0.0.1 --port 8000 > stac.log 2>&1 &
          server_pid=$!
          for i in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::STAC API exited during startup"
              cat stac.log
              exit 1
            fi
            if curl -fsS --max-time 2 "$STAC_API_URL/collections/naip" >/dev/null 2>&1; then
              echo "STAC API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Timed out waiting for STAC API"
          cat stac.log
          exit 1

      - name: Run tests
        env:
          STAC_API_URL: ${{ env.STAC_API_URL }}
        run: |
          cwltest --test experimental/tests/tests-stac-api-client.yaml --tool cwltool --verbose -- --no-container 
