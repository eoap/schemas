site_name: EOAP schemas
site_url: https://eoap.github.io/schemas/
site_author: Fabrice Brito, Simone Tripodi
repo_url: https://github.com/eoap/schemas/
repo_name: eoap/schemas

theme:
  logo: imgs/icon-eoap.png
  name: readthedocs

  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode

plugins:
  - search
  - mermaid2:
      version: 10.6.0
  - mkdocs-jupyter:
      execute: true
      kernel_name: bash
      show_input: False
      no_input: True

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span

extra_css:
  - styles/css/app.css

extra_javascript:
  - javascripts/config.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Your first custom-type input: tutorials/first-input.md
    - GeoJSON:
      - Point: geojson/point.ipynb
      - Feature: geojson/feature.ipynb
    - OGC bounding box: ogc/bbox.ipynb
    - STAC:
      - Catalog: stac/catalog.ipynb
      - Collection: stac/collection.ipynb
      - Item: stac/item.ipynb
    - String formats:
      - Date and time: string-format/datetime.ipynb
      - URI: string-format/uri.ipynb
    - Experimental:
      - Discovery inputs: experimental/discovery.ipynb
      - Process inputs: experimental/process.ipynb
  - How-to guides:
    - Overview: how-to/index.md
    - Use an existing schema: how-to/use-schema.md
    - Define new types: newtypes.md
  - Reference:
    - Overview: reference/index.md
    - GeoJSON:
      - Types: geojson/index.md
      - Schema details: geojson/schema.html
    - OGC API Processes:
      - Types: ogc/index.md
      - Schema details: ogc/schema.html
    - STAC:
      - Types: stac/index.md
      - Schema details: stac/schema.html
    - String formats:
      - Types: string-format/index.md
      - Schema details: string-format/schema.html
  - Explanation:
    - Custom types and their limits: explanation/custom-types.md

copyright: <a href="https://www.apache.org/licenses/LICENSE-2.0"><img src="https://img.shields.io/badge/license-Apache%20License%202.0-blue"" alt="Apache License, Version 2.0" /></a>
